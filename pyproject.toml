[project]
name = 'lacosmic'
description = 'Laplacian Cosmic Ray Identification'
readme = 'README.rst'
license = 'BSD-3-Clause'
license-files = ['LICENSE.rst']
authors = [
    {name = 'Larry Bradley', email = 'larry.bradley@gmail.com'},
]
keywords = [
    'astronomy',
    'astrophysics',
    'images',
    'cosmic rays',
    'cosmic-ray removal',
    'filtering',
]
classifiers = [
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy',
]
dynamic = ['version']
requires-python = '>=3.12'
dependencies = [
    'astropy>=7.0',
    'numpy>=2.0',
    'scipy>=1.15',
]

[project.urls]
Homepage = 'https://github.com/larrybradley/lacosmic'
Documentation = 'https://lacosmic.readthedocs.io/en/stable/'

[project.optional-dependencies]
test = [
    'pytest>=9.0',
    'pytest-astropy-header>=0.2.2',
    'pytest-doctestplus>=1.4',
]
docs = [
    'matplotlib>=3.10',
    'numpydoc>=1.8',
    'pydata-sphinx-theme>=0.16',
    'sphinx>=8.2',  # keep in sync with docs/conf.py
    'sphinx-astropy>=1.11',
    'sphinx-automodapi>=0.18',
    'sphinx-copybutton>=0.5',
]
dev = [
    'lacosmic[docs,test]',
    'pre-commit>=4.0',
    'tox>=4.24',
]

[build-system]
requires = [
    'setuptools>=77.0.1',
    'setuptools_scm>=8.2',
]
build-backend = 'setuptools.build_meta'

[tool.setuptools_scm]
version_file = 'lacosmic/version.py'

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
'lacosmic' = [
    'data/*',
]

[tool.pytest]
minversion = "9.0"
testpaths = [
    'lacosmic',
    'docs',
]
norecursedirs = [
    'docs/_build',
    'extern',
]
astropy_header = true
astropy_header_packages = [
    'lacosmic',
    'astropy',
    'numpy',
    'scipy',
]
doctest_plus = 'enabled'
text_file_format = 'rst'
addopts = [
    '-ra',
    '--color=yes',
    '--doctest-rst',
    '--strict-config',
    '--strict-markers',
]
log_level = 'INFO'
xfail_strict = true
filterwarnings = [
    'error',  # turn warnings into exceptions
]

[tool.coverage.run]
omit = [
    'lacosmic/__init__*',
    'lacosmic/**/conftest.py',
    'lacosmic/**/tests/*',
    'lacosmic/version*',
    '*/lacosmic/__init__*',
    '*/lacosmic/**/conftest.py',
    '*/lacosmic/**/tests/*',
    '*/lacosmic/version*',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'def main\\(.*\\):',
]

[tool.isort]
skip_glob = [
    'lacosmic/*__init__.py*',
]
known_first_party = [
    'lacosmic',
]
use_parentheses = true

[tool.black]
# Exclude every file so that black never reformats the code if an
# editor or another tool runs it. This project does not use black.
force-exclude = """
(
  .*
)
"""

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.repo-review]
ignore = [
    'MY',  # ignore MyPy
    'PC110',  # ignore using black or ruff-format in pre-commit
    'PC111',  # ignore using blacken-docs in pre-commit
    'PC140',  # ignore using mypy in pre-commit
    'PC180',  # ignore using prettier in pre-commit
    'PC901',  # ignore using custom pre-commit update message
    'PC902',  # ignore custom pre-commit CI autofix message
    'PP006',  # ignore missing dependency-groups in pyproject.toml
    'PY005',  # ignore having a tests/ folder
]

[tool.docformatter]
    wrap-summaries = 72
    pre-summary-newline = true
    make-summary-multi-line = true

[tool.numpydoc_validation]
checks = [
    'all',   # report on all checks, except the below
    'ES01',  # missing extended summary
    'EX01',  # missing "Examples"
    'RT01',  # do not require return type for lazy properties
    'RT02',  # only type in "Returns" section (no name)
    'SA01',  # missing "See Also"
    'SA04',  # missing "See Also" description
    'SS06',  # single-line summary
]

# don't report on objects that match any of these regex;
# remember to use single quotes for regex in TOML
exclude = [
    '__init__',
    '\._.*',  # private functions/methods
    '^test_*',  # test code
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'ANN',  # type annotations
    'D200',  # unnecessary-multiline-docstring
    'D205',  # missing-blank-line-after-summary
    'PLR0913',  # too-many-arguments
    'PLR0917',  # too-many-positional-arguments
    'PTH',  # Pathlib usage
]

[tool.ruff.lint.flake8-copyright]
min-file-size = 1  # skip empty files (< 1 byte), e.g., __init__.py
notice-rgx = 'Licensed under a 3-clause BSD style license - see LICENSE.rst'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.per-file-ignores]
'__init__.py' = [
    'D104',  # undocumented-public-package
    'I',  # isort
    'RUF100',  # flake8 needs the F401 noqa on star imports, ruff does not
]
'docs/conf.py' = [
    'ERA001',  # commented-out-code
    'INP001',  # implicit-namespace-package
    'TRY400',  # error-instead-of-exception
]
'test_*.py' = [
    'D',  # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.lint.pylint]
max-statements = 130
